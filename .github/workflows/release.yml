name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendor Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target lib

      - name: Extract version and notes
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<EOF'
            echo "Release $TAG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create plugin zip
        run: |
          zip -r "TextTools-${{ steps.meta.outputs.version }}.zip" . \
            -x ".git/*" \
            -x ".git/**/*" \
            -x ".github/*" \
            -x ".github/**/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Text Tools ${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.notes }}
          files: TextTools-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: false
