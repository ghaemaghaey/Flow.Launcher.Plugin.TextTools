name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendor Python dependencies (Windows cp311)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target lib

      - name: Extract version
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create plugin zip
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "texttools-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @('.git', '.github', 'tests', '__pycache__')
          } | Copy-Item -Destination $stage -Recurse -Force
          Get-ChildItem $stage -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force
          Get-ChildItem $stage -Recurse -File -Filter '*.pyc' | Remove-Item -Force
          Compress-Archive -Path (Join-Path $stage '*') `
            -DestinationPath "TextTools-${{ steps.meta.outputs.version }}.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Text Tools ${{ steps.meta.outputs.version }}
          body: "Release ${{ steps.meta.outputs.version }}"
          files: TextTools-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: false
